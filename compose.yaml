# Tab, self-hosted: `docker compose up` runs the whole thing.
#   web      the Phoenix app (http://localhost:4000)
#   extract  reads bills and receipts; optional, nothing in the ledger needs it
#   db       Postgres; your data lives in the `tab-db` volume
#
# For local development, `mise run db` starts only the database.

services:
  web:
    image: ghcr.io/johnhkchen/tab-web:${TAB_VERSION:-0.1.0}
    build: ./web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://postgres:${POSTGRES_PASSWORD:-postgres}@db/tab
      # Leave unset and the app makes one on first boot, kept in the tab-data volume.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      PHX_HOST: ${PHX_HOST:-localhost}
      EXTRACT_URL: http://extract:4100
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - tab-data:/app/data
    restart: unless-stopped

  extract:
    image: ghcr.io/johnhkchen/tab-extract:${TAB_VERSION:-0.1.0}
    build: ./extract
    # No database credentials, on purpose: extraction can only propose, never write.
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: tab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tab-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  tab-db:
  tab-data:

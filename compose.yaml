# Tab, self-hosted: `docker compose up` runs the whole thing.
#   web      the Phoenix app (http://localhost:4000)
#   extract  reads bills and receipts; optional, nothing in the ledger needs it
#   db       Postgres; your data lives in the `tab-db` volume
#
# Locked down by default, so it's safe on a machine that also runs other things:
#   - Postgres has no published port and sits on its own network with no
#     internet access. Only `web` joins it; `extract` can't even reach it.
#   - Every container runs as a non-root user, with a read-only filesystem,
#     no extra Linux capabilities, and memory/process limits.
#   - TAB_LISTEN picks which host address the app listens on. Behind a reverse
#     proxy on a shared server, set it to 127.0.0.1.
#
# For local development, `mise run db` adds compose.dev.yaml, which publishes
# Postgres on 127.0.0.1:5432.

x-locked-down: &locked-down
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  pids_limit: 256
  restart: unless-stopped

services:
  web:
    <<: *locked-down
    image: ghcr.io/johnhkchen/tab-web:${TAB_VERSION:-0.3.0}
    build: ./web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://postgres:${POSTGRES_PASSWORD:-postgres}@db/tab
      # Leave unset and the app makes one on first boot, kept in the tab-data volume.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      PHX_HOST: ${PHX_HOST:-localhost}
      EXTRACT_URL: http://extract:4100
      TAB_CURRENCY: ${TAB_CURRENCY:-USD}
      # Mail: Resend, or any SMTP service; with neither, emails go to the log.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-}
      TAB_MAIL_FROM: ${TAB_MAIL_FROM:-}
      # Receiving forwarded bills through Resend; leave unset to skip it.
      TAB_INBOUND_DOMAIN: ${TAB_INBOUND_DOMAIN:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      TAB_READS_PER_DAY: ${TAB_READS_PER_DAY:-30}
      # The release writes its runtime files here instead of its read-only install dir.
      RELEASE_TMP: /tmp
    ports:
      - "${TAB_LISTEN:-0.0.0.0}:${PORT:-4000}:4000"
    volumes:
      - tab-data:/app/data
    networks: [data, outside]
    mem_limit: 768m

  extract:
    <<: *locked-down
    image: ghcr.io/johnhkchen/tab-extract:${TAB_VERSION:-0.3.0}
    build: ./extract
    # No database credentials and no route to the database, on purpose:
    # extraction can only propose, never write. It needs the internet only to
    # reach the AI provider.
    environment:
      HOME: /tmp
      # Turns bill reading on (Claude Haiku). Unset, bills are typed in by hand.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks: [outside]
    mem_limit: 512m

  db:
    <<: *locked-down
    image: postgres:18-alpine
    # The image's startup script needs these to set up its data directory and
    # drop from root to the postgres user. Everything else stays dropped.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs: ["/tmp", "/var/run/postgresql"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: tab
    volumes:
      - tab-db:/var/lib/postgresql
    networks: [data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  # web <-> db only: no internet, nothing published to the host.
  data:
    internal: true
  # web <-> extract, and their way out (the AI provider, email, payments).
  outside:

volumes:
  tab-db:
  tab-data:
